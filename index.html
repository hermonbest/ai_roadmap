<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered Coding Roadmap — Interactive Learning Platform</title>
  <meta name="description" content="An interactive, high-performance web course guiding you from zero coding knowledge to building and deploying full-stack apps with AI coding tools.">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    frame-src https://www.youtube.com https://www.youtube-nocookie.com;
    img-src 'self' data: https:;
    connect-src 'self';
  ">
  <link rel="stylesheet" href="styles.css">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <a href="#" class="brand">
      <span class="brand-badge">COURSE</span>
      <span>AI-Powered Coding Roadmap</span>
    </a>
    
    <div class="nav-actions">
      <button class="search-trigger-btn" id="search-trigger-btn">
        <span>🔍 Search topics...</span>
        <span class="kbd-shortcut">Ctrl K</span>
      </button>
    </div>
  </header>

  <!-- Application Shell Container -->
  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-title">Course Roadmap Stages</div>
      <div id="stage-nav-list"></div>
    </aside>

    <!-- Main Content Viewport -->
    <main class="main-viewport" id="main-viewport"></main>
  </div>

  <!-- Command Palette Modal (Ctrl + K) -->
  <div class="modal-backdrop" id="command-modal">
    <div class="command-modal">
      <div class="command-input-wrapper">
        <span>🔍</span>
        <input type="text" class="command-input" id="command-input" placeholder="Search lessons, concepts, prompts..." />
        <span class="kbd-shortcut">ESC</span>
      </div>
      <div class="command-results" id="command-results"></div>
    </div>
  </div>

  <!-- AI Tutor Chat Widget -->
  <div class="chat-widget">
    <button class="chat-toggle-btn" id="chat-toggle-btn" aria-label="Open AI Tutor chat">
      <span>🤖</span>
    </button>

    <div class="chat-panel" id="chat-panel" aria-label="AI Tutor chat">
      <div class="chat-header">
        <div class="chat-header-title">
          <span class="chat-header-icon">🤖</span>
          <div>
            <div class="chat-header-name">AI Tutor</div>
            <div class="chat-header-status">gemini-3.1-flash-lite</div>
          </div>
        </div>
        <button class="chat-close-btn" id="chat-close-btn" aria-label="Close chat">✕</button>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="chat-msg chat-msg-bot">
          <p>Hi! I'm your AI coding tutor. Ask me anything about the course — from setting up your environment to building and deploying full-stack apps with AI tools.</p>
        </div>
      </div>

      <form class="chat-input-row" id="chat-form" autocomplete="off">
        <input type="text" class="chat-input" id="chat-input" placeholder="Ask about any topic..." aria-label="Chat message" />
        <button type="submit" class="chat-send-btn" id="chat-send-btn" aria-label="Send message">➤</button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/course-data.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
